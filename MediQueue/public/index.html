<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>MediQueue – Smart Hospital Queue</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f4f9fb;--card:#fff;--tx:#12303d;--mut:#5b7480;--b:#d9e6ec;--pri:#0b7fc4;--teal:#0d9488;--grn:#16a34a;--amb:#d97706;--red:#dc2626;--soft:#e6f4f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1a21;--card:#13262f;--tx:#e6f1f5;--mut:#92aab5;--b:#254250;--soft:#123a38}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1a21;--card:#13262f;--tx:#e6f1f5;--mut:#92aab5;--b:#254250;--soft:#123a38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--b);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.logo{font-weight:800;font-size:1.25rem;color:var(--pri);margin-right:auto}.logo span{color:var(--teal)}
nav{display:flex;flex-wrap:wrap;gap:4px}nav a{padding:8px 12px;border-radius:10px;color:var(--tx);text-decoration:none;font-weight:600;font-size:.95rem}nav a.on,nav a:hover{background:var(--soft);color:var(--teal)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px;animation:in .35s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-size:1.9rem;margin:.2em 0}h2{font-size:1.3rem;margin:.2em 0 .6em}
.card{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.hero{background:linear-gradient(135deg,var(--pri),var(--teal));color:#fff;border:0}.hero p{opacity:.95}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 20px;border-radius:12px;border:0;background:var(--pri);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.6;cursor:wait}.btn.sec{background:var(--soft);color:var(--teal)}.btn.red{background:var(--red)}.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}.hero .btn{background:#fff;color:var(--pri)}
label{display:block;font-weight:600;margin:12px 0 4px}input,select{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--b);background:var(--bg);color:var(--tx);font:inherit}
.err{color:var(--red);font-size:.9rem;min-height:1.2em}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:.85rem;color:#fff}.Waiting{background:var(--pri)}.Almost{background:var(--amb)}.Consult{background:var(--grn)}.Done,.Off{background:#6b7f89}.Delayed,.Cancelled,.Closed{background:var(--red)}.Available{background:var(--grn)}.Consulting{background:var(--teal)}
.tok{font-size:3rem;font-weight:800;color:var(--pri);letter-spacing:2px;line-height:1.1}
.bar{height:16px;border-radius:99px;background:var(--b);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--grn));transition:width .8s}
.stat{font-size:2rem;font-weight:800;color:var(--teal)}.mut{color:var(--mut);font-size:.9rem}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--teal));color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.95rem}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b);white-space:nowrap}
#toasts{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:grid;gap:8px;max-width:340px}
.toast{background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;animation:in .3s;font-size:.95rem}
.warn{background:#fff7e6;color:#7a4b00;border:1px solid #f1c27a;border-radius:12px;padding:10px 14px;font-size:.9rem}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#3a2c10;color:#f5d08f;border-color:#6b5120}}
.live{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--grn);margin-left:4px}.live.off{background:var(--red)}
body.kiosk header,body.kiosk #toasts{display:none}body.kiosk main{max-width:none;padding:24px}.chk{display:flex;gap:10px;align-items:center;font-weight:400}.chk input{width:24px;min-height:24px;flex:none}
svg text{font:600 12px system-ui;fill:var(--tx)}.room{fill:var(--card);stroke:var(--b);stroke-width:2}.room.hi{fill:var(--soft);stroke:var(--teal);stroke-width:3}
@media print{header,#toasts,.noprint{display:none!important}body::before{display:none}}
</style></head><body>
<header><div class="logo">Medi<span>Queue</span></div><nav id="nav"></nav></header>
<main id="app"><p class="mut">Connecting to the hospital server…</p></main><div id="toasts"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store=(k,v,session)=>{try{const st=session?sessionStorage:localStorage;v?st.setItem(k,v):st.removeItem(k)}catch(e){}};
const read=(k,session)=>{try{return(session?sessionStorage:localStorage).getItem(k)}catch(e){return null}};
// P = public state from the server, TK = token details by id, AD = admin token list
let P=null,TK={},AD=null,me=read('mq_me'),adm=read('mq_admin',1),tab='queues',notes=[],sent={},form={},mapSel=null,online=false,lastDept=null,sound=false,prevServing=null;

async function api(path,body,method){const o={method:method||(body?'POST':'GET'),headers:{}};
 if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}if(adm)o.headers.Authorization='Bearer '+adm;
 const r=await fetch('/api'+path,o),j=await r.json().catch(()=>({}));
 if(r.status===401&&path.startsWith('/admin')&&path!=='/admin/login'){adm=null;AD=null;store('mq_admin',null,1)}
 if(!r.ok)throw Object.assign(new Error(j.error||'Request failed ('+r.status+')'),{status:r.status,field:j.field});return j}

const dp=n=>P.depts.find(d=>d.n===n);
const docOf=dn=>P.doctors.find(x=>x.dept===dn&&x.s!=='Off duty')||P.doctors.find(x=>x.dept===dn);
function route(){const h=location.hash.slice(1)||'home';return h.startsWith('track-')?'track':h}
function trackId(){const h=location.hash.slice(1);return h.startsWith('track-')?h.slice(6):me}

async function loadTok(id){try{TK[id]=await api('/tokens/'+encodeURIComponent(id))}catch(e){if(e.status===404){TK[id]={missing:1};if(id===me){me=null;store('mq_me',null)}}else throw e}}
let loading=false,again=false;
async function refresh(force){if(loading){again=true;return}loading=true;
 try{P=await api('/state');online=true;const h=route(),ids=new Set([me]);if(h==='track')ids.add(trackId());
  await Promise.all([...ids].filter(Boolean).map(loadTok));
  if(h==='admin'&&adm)AD=await api('/admin/tokens').catch(()=>null);
  checkAlerts();announce()}catch(e){if(!e.status)online=false}
 loading=false;const a=document.activeElement,typing=a&&$('#app').contains(a)&&/INPUT|SELECT/.test(a.tagName),h=route();
 if(force||!(typing||(h==='admin'&&!adm)))draw();else drawNav();
 if(again){again=false;refresh()}}

function checkAlerts(){const t=me&&TK[me];if(!t||t.missing)return;
 if(lastDept&&lastDept!==t.dept)toast('Your token was transferred to '+t.dept+'. New token: '+t.label+'.');lastDept=t.dept;
 if(t.st==='waiting')[3,1].forEach(l=>{if(t.ahead<=l&&!sent[t.id+t.label+l]){sent[t.id+t.label+l]=1;toast(l===3?'Your turn is approaching: only '+t.ahead+' patient(s) ahead.':'Almost your turn! Please head to '+t.room+'.')}});
 if(t.st==='consult'&&!sent[t.id+'c']){sent[t.id+'c']=1;toast("It's your turn! Please go to "+t.room+' now.')}}
// Waiting-room display: chime + spoken announcement when a department calls a new token.
function announce(){const now={};P.depts.forEach(d=>now[d.n]=d.serving);
 if(prevServing&&route()==='display'&&sound)P.depts.forEach(d=>{if(d.serving&&d.serving!==prevServing[d.n])say('Token '+d.serving.replace('-',' ').replace(/ 0+(?=\d)/,' ')+', please go to '+d.room+', '+d.n+'.',true)});
 prevServing=now}
function say(text,chime){try{if(chime){const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.8);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.8)}
 if(window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(text))}catch(e){}}
function toast(m){notes.unshift(m);const e=document.createElement('div');e.className='toast';e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),5000);drawNav()}

const NAV=[['home','Home'],['register','Register'],['track','Live Queue'],['doctors','Doctors'],['map','Map'],['admin','Admin']];
function drawNav(){const h=route();$('#nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]===h?'on':''}">${n[1]}</a>`).join('')+`<a href="#alerts" class="${h==='alerts'?'on':''}">🔔${notes.length?' '+notes.length:''}</a><a title="${online?'Live: connected to server':'Offline: cannot reach server'}"><span class="live ${online?'':'off'}"></span></a>`}
function draw(){const h=route();drawNav();document.body.classList.toggle('kiosk',h==='display');
 if(!P){$('#app').innerHTML=`<h1>Cannot reach the server</h1><div class="card"><p>MediQueue could not connect to the hospital server. Retrying automatically…</p></div>`;return}
 const v={home,register,token,track,doctors,map,admin,alerts,display}[h]||home;$('#app').innerHTML=(online?'':'<p class="warn">Connection lost. Showing the last known data; retrying…</p>')+v();if(window['after_'+h])window['after_'+h]()}
const sv=t=>`<span class="badge ${t.statusClass}">${t.statusText}</span>`;

function home(){return `<div class="card hero"><h1>Skip the line. Know your turn.</h1><p>Get a digital token, scan your QR code and follow your place in the queue in real time.</p><div class="row"><a class="btn" href="#register">Get a token</a><a class="btn" href="#track">Track my token</a></div></div>
<div class="grid"><div class="card"><div class="mut">Patients waiting now</div><div class="stat">${P.waiting}</div></div><div class="card"><div class="mut">Doctors available</div><div class="stat">${P.doctors.filter(d=>d.s==='Available').length}/${P.doctors.length}</div></div><div class="card"><div class="mut">Busiest department</div><div class="stat" style="font-size:1.4rem">${P.busiest}</div></div></div>
<h2>Now serving · current token by department</h2><div class="grid">${P.depts.map(d=>`<div class="card"><b>${d.n}</b><div class="mut">${d.room} · Now serving</div><div class="tok" style="font-size:2.4rem">${d.serving||'–'}</div><div class="row sp"><span class="mut">Current token</span><span class="badge ${d.paused?'Closed':d.active>=8?'Almost':'Available'}">${d.paused?'Paused':d.active>=8?'Busy':'Light'}</span></div><div class="mut">${d.active} in queue</div></div>`).join('')}</div>
<p class="warn">${P.simulated?'Demo mode: sample patients and queue movement are simulated by the server. ':''}Wait times are approximate, not guaranteed.</p>`}

function register(){const q=P.depts.slice().sort((a,b)=>a.active-b.active)[0];return `<h1>Patient Registration</h1><div class="card"><label for="f_n">Full name</label><input id="f_n" autocomplete="name" oninput="form.n=this.value" value="${esc(form.n||'')}"><div class="err" id="e_name"></div>
<label for="f_a">Age</label><input id="f_a" type="number" oninput="form.a=this.value" inputmode="numeric" value="${esc(form.a||'')}"><div class="err" id="e_age"></div>
<label for="f_p">Phone number</label><input id="f_p" type="tel" oninput="form.p=this.value" placeholder="03XXXXXXXXX" value="${esc(form.p||'')}"><div class="err" id="e_phone"></div>
<label for="f_d">Department</label><select id="f_d" onchange="form.d=this.value;hint()">${P.depts.map(d=>`<option ${d.n===form.d?'selected':''}>${d.n}</option>`).join('')}</select><div class="err" id="e_dept"></div>
<label class="chk"><input type="checkbox" id="f_s" ${form.s?'checked':''} onchange="form.s=this.checked"> Text me (SMS) when my turn is near</label>
<p class="mut" id="hint"></p><button class="btn" id="go" onclick="reg()">Generate my token</button></div><p class="mut">Least crowded right now: <b>${q.n}</b> (approximate).</p>`}
function after_register(){hint()}
function hint(){const d=dp($('#f_d').value);$('#hint').textContent=d.paused?`${d.n} is paused and not accepting new tokens right now.`:d.active>=8?`Heavy traffic in ${d.n} (${d.active} waiting). Approximate: quieter later in the afternoon.`:`${d.active} waiting. Estimated wait about ${d.est} min (approximate).`}
async function reg(){const n=$('#f_n').value.trim(),a=+$('#f_a').value,p=$('#f_p').value.replace(/[\s-]/g,''),dn=$('#f_d').value;form={n,a:$('#f_a').value,p:$('#f_p').value,d:dn,s:$('#f_s').checked};let ok=1;
 const e=(k,m)=>{$('#e_'+k).textContent=m;if(m)ok=0};e('dept','');e('name',n.length<3?'Please enter your full name.':'');e('age',!(a>0&&a<121)?'Enter an age between 1 and 120.':'');e('phone',!/^(\+?92|0)3\d{9}$/.test(p)?'Enter a valid mobile number, e.g. 03001234567.':'');if(!ok)return;
 const b=$('#go');b.textContent='Generating…';b.disabled=true;
 try{const t=await api('/tokens',{name:n,age:a,phone:p,dept:dn,sms:form.s});TK[t.id]=t;me=t.id;lastDept=t.dept;store('mq_me',me);form={};location.hash='#token'}
 catch(err){b.textContent='Generate my token';b.disabled=false;const el=err.field&&$('#e_'+err.field);el?el.textContent=err.message:toast(err.message)}}

function token(){const t=me&&TK[me];if(!me||!t||t.missing)return `<h1>No token yet</h1><a class="btn" href="#register">Register now</a>`;
 return `<h1>Your Digital Token</h1><div class="card" style="text-align:center"><div class="mut">Token number</div><div class="tok">${t.label}</div><div id="qr" style="display:inline-block;padding:12px;background:#fff;border-radius:12px;margin:12px 0"></div>
<div><b>${esc(t.name)}</b> · ${t.dept}</div><div class="mut">${t.doctor?esc(t.doctor.name)+' · ':''}${t.room}</div><p>Now serving: <b>${t.serving||'–'}</b><br>Estimated wait: <b>${t.est!=null?t.est+' min':'–'}</b> <span class="mut">(approximate)</span></p>
<p class="mut">This QR holds only a secure random ID. No personal details are stored in it.</p><div class="row noprint" style="justify-content:center"><a class="btn" href="#track">Track live queue</a><button class="btn sec" onclick="window.print()">Print / Save as PDF</button></div></div>`}
function after_token(){const t=me&&TK[me];if(t&&!t.missing&&window.QRCode)new QRCode($('#qr'),{text:location.href.split('#')[0]+'#track-'+t.id,width:190,height:190})}

function track(){const id=trackId(),t=id&&TK[id];if(id&&!t)return `<h1>Live Queue</h1><p class="mut">Loading token…</p>`;
 if(!t||t.missing)return `<h1>Live Queue</h1><div class="card"><p>${t&&t.missing?'That token was not found.':'No token found on this device.'}</p><a class="btn" href="#register">Get a token</a></div><h2>Now serving</h2>${nowBoard()}`;
 const pct=t.st==='waiting'?Math.max(5,Math.round((1-t.ahead/Math.max(1,t.start))*100)):100,dc=t.doctor;
 return `<h1>Live Queue Tracking</h1><div class="card"><div class="row sp"><div><div class="mut">Your token</div><div class="tok">${t.label}</div></div>${sv(t)}</div><div class="bar" style="margin:14px 0"><i style="width:${pct}%"></i></div>
<div class="grid"><div><div class="mut">Now serving</div><b style="font-size:1.6rem">${t.serving||'–'}</b></div><div><div class="mut">Patients ahead</div><b style="font-size:1.6rem">${t.ahead}</b></div><div><div class="mut">Est. wait (approx.)</div><b style="font-size:1.6rem">${t.est!=null?t.est+' min':'–'}</b></div></div></div>
<div class="card"><b>${dc?esc(dc.name):'Doctor TBA'}</b> · ${t.dept} · ${t.room}${dc&&dc.s!=='Available'?` <span class="badge ${dc.s==='Off duty'?'Off':'Delayed'}">${dc.s}</span>`:''}</div>
${t.st==='waiting'&&t.ahead<=3?'<div class="warn">Your turn is coming up. Please stay near '+t.room+'.</div>':''}<p class="mut">Updates live from the hospital server${t.sms?'. SMS alerts are on for this token':''}. Estimates are approximate, not guaranteed.</p>
${t.id===me&&t.st==='waiting'?`<button class="btn sec noprint" onclick="selfCancel()">I can't make it: cancel my token</button>`:''}${t.id===me&&(t.st==='done'||t.st==='cancelled')?`<a class="btn noprint" href="#register">Get a new token</a>`:''}`}
async function selfCancel(){if(!confirm('Cancel your token? You will lose your place in the queue.'))return;try{TK[me]=await api('/tokens/'+me+'/cancel',{});toast('Your token was cancelled.')}catch(e){toast(e.message)}refresh(true)}

function display(){return `<div class="row sp"><h1 style="font-size:2.6rem">Now Serving</h1><div class="row"><b id="clock" style="font-size:1.6rem"></b><button class="btn sm sec" onclick="sound=!sound;if(sound)say('Announcements on');draw()">${sound?'🔊 Sound on':'🔇 Enable sound'}</button><a class="btn sm sec" href="#admin">Exit</a></div></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${P.depts.map(d=>`<div class="card" style="text-align:center"><div style="font-size:1.5rem;font-weight:800">${d.n}</div><div class="mut" style="font-size:1.1rem">${d.room}</div><div class="tok" style="font-size:5rem;margin:12px 0">${d.serving||'–'}</div>${d.paused?'<span class="badge Closed">Paused</span>':`<div class="mut" style="font-size:1.1rem">${d.waiting} waiting</div>`}</div>`).join('')}</div>
<p class="mut" style="text-align:center">Please wait until your token is shown, then go to the room listed. Register at Reception or scan the QR at the entrance.</p>`}
function after_display(){tickClock()}
function tickClock(){const c=$('#clock');if(c)c.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
setInterval(tickClock,10000);

function doctors(){return `<h1>Doctors</h1><div class="grid">${P.doctors.map(x=>{const s=x.consulting?'Consulting':x.s==='Off duty'?'Off':x.s;
 return `<div class="card"><div class="row"><div class="av">${x.name.split(' ').slice(1).map(w=>w[0]).join('')}</div><div><b>${esc(x.name)}</b><div class="mut">${x.dept}</div></div></div><p class="mut" style="margin:10px 0 4px">${esc(x.q)}<br>${esc(x.time)}</p><span class="badge ${s}">${x.consulting?'Consulting':x.s}</span>${x.s==='Delayed'?`<div class="mut">Estimated wait for doctor: ~15 min</div>`:x.consulting?`<div class="mut">Free in about ${dp(x.dept).avg} min</div>`:''}</div>`}).join('')}</div>`}

const ROOMS=[['Reception',1,1],['Pharmacy',2,1],['Laboratory',3,1],['General Medicine',1,2],['Neurology',2,2],['Cardiology',3,2],['Pediatrics',1,3],['Emergency',2,3],['Entrance',3,3]];
const rx=r=>20+(r[1]-1)*140,ry=r=>20+(r[2]-1)*110;
function nowBoard(){return `<div class="grid">${P.depts.map(d=>`<div class="card"><b>${d.n}</b><div class="tok" style="font-size:2.2rem">${d.serving||'–'}</div><div class="mut">${d.active} in queue</div></div>`).join('')}</div>`}
function mapPath(n){const r=ROOMS.find(x=>x[0]===n);if(!r||n==='Entrance')return[];const cx=rx(r)+65,g=r[1]===1?155:295,p=[[365,258],[365,220]];if(r[2]===3)p.push([cx,220],[cx,255]);else if(r[2]===2)p.push([cx,220],[cx,185]);else p.push([g,220],[g,110],[cx,110],[cx,75]);return p}
function mapSvg(sel){const p=mapPath(sel);return `<div class="scroll"><svg viewBox="0 0 450 330" style="width:100%;min-width:420px;margin-top:12px"><rect x="10" y="90" width="430" height="40" fill="var(--soft)" opacity=".6"/><rect x="10" y="200" width="430" height="40" fill="var(--soft)" opacity=".6"/>${ROOMS.map(r=>`<g onclick="mapSel='${r[0]}';draw()" style="cursor:pointer"><rect class="room ${r[0]===sel?'hi':''}" x="${rx(r)}" y="${ry(r)}" width="130" height="70" rx="10"/><text x="${rx(r)+65}" y="${ry(r)+(r[0]==='Entrance'?60:39)}" text-anchor="middle">${r[0]==='Entrance'?'Main Entrance':r[0]}</text></g>`).join('')}${p.length?`<polyline points="${p.map(q=>q.join(',')).join(' ')}" fill="none" stroke="var(--pri)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="1s" repeatCount="indefinite"/></polyline><circle cx="${p[p.length-1][0]}" cy="${p[p.length-1][1]}" r="9" fill="var(--red)"/>`:''}<circle cx="365" cy="258" r="9" fill="var(--grn)" stroke="#fff" stroke-width="3"/><text x="365" y="284" text-anchor="middle" style="fill:var(--grn)">You are here</text></svg></div>`}
function mapInfo(n){if(n==='Entrance')return '<div class="card" style="background:var(--soft)"><b>You are here: Main Entrance</b></div>';const r=ROOMS.find(x=>x[0]===n),d=dp(n),dc=d&&docOf(n),col=r[1],row=r[2];let s;
 if(row===3)s=col===2?['Turn left (west) along the front corridor.','Emergency is the first room beside the entrance. Go in through the door on your left.']:['Turn left (west) along the front corridor.','Walk to the far end. Pediatrics is the last room, on your left.'];
 else if(row===2)s=col===3?['Walk straight ahead (north). Cardiology is directly in front of the entrance.']:['Turn left (west) along the front corridor.',col===1?'Walk to the far end, below General Medicine, then turn right (north) into its door.':'Walk until you are below Neurology, then turn right (north) into its door.'];
 else s=['Turn left (west) along the front corridor.',col===1?'Walk past the middle rooms to the passage between the left and middle rooms, then turn right (north).':'Take the first passage on your right (north), between the middle and right-hand rooms.','At the upper corridor turn '+(col===3?'right (east)':'left (west)')+' and walk to '+n+'.'];
 return '<div class="card" style="background:var(--soft)"><b>'+n+'</b>'+(d?' · '+d.room+'<div>Now serving: <b>'+(d.serving||'–')+'</b>'+(dc?' · '+esc(dc.name):'')+'</div>':'')+'</div><h2>How to get there</h2><ol><li>Start at the Main Entrance (the green dot, you are here).</li>'+s.map(x=>'<li>'+x+'</li>').join('')+'</ol>'}
function map(){const t=me&&TK[me],sel=mapSel||(t&&!t.missing?t.dept:'Cardiology');
 return `<h1>Hospital Navigator</h1><div class="card"><label for="ms">Where do you need to go? (or tap a room on the map)</label><select id="ms" onchange="mapSel=this.value;draw()">${['Reception','Pharmacy','Laboratory',...P.depts.map(d=>d.n)].map(n=>`<option ${n===sel?'selected':''}>${n}</option>`).join('')}</select>
${mapSvg(sel)}
${mapInfo(sel)}
<p class="mut">Facilities: wheelchair ramps at all entrances, lifts to every floor, accessible washrooms, wheelchair assistance at Reception.</p><p class="mut">Demo floor plan, not to scale.</p></div>`}
function alerts(){return `<h1>Notifications</h1><div class="card">${notes.length?notes.map(n=>`<p>🔔 ${esc(n)}</p>`).join(''):'<p class="mut">No alerts yet. You will be notified when your turn approaches or a doctor is delayed.</p>'}<p class="mut">Alerts arrive live while this page is open. Tick "Text me" when registering to also get SMS alerts.</p></div>`}

function admin(){if(!adm)return `<h1>Admin Sign-in</h1><div class="card"><label for="pin">Staff PIN</label><input id="pin" type="password" inputmode="numeric" onkeydown="if(event.key==='Enter')login()"><div class="err" id="pe"></div><button class="btn" onclick="login()">Sign in</button><p class="mut">The PIN is set on the server (ADMIN_PIN, default 1234).</p></div>`;
 if(!AD)return `<h1>Admin Dashboard</h1><p class="mut">Loading…</p>`;
 const D=P.depts,tabs=['queues','tokens','doctors','issue'];
 const body={queues:()=>`<div class="grid">${D.map(d=>`<div class="card"><b>${d.n}</b><div>Serving: <b>${d.serving||'–'}</b> · Waiting: <b>${d.waiting}</b></div><div class="row" style="margin-top:8px"><button class="btn sm" onclick="callNext('${d.n}')">Call next</button><button class="btn sm ${d.paused?'':'sec'}" onclick="pauseQ('${d.n}',${!d.paused})">${d.paused?'Resume':'Pause'}</button></div></div>`).join('')}</div>`,
 tokens:()=>`<div class="card scroll"><table><tr><th>Token</th><th>Patient</th><th>Phone</th><th>Dept</th><th>Status</th><th>Actions</th></tr>${AD.tokens.length?AD.tokens.map(t=>`<tr><td><b>${t.label}</b></td><td>${esc(t.name)}${t.age?' <span class="mut">('+t.age+')</span>':''}</td><td class="mut">${t.phone?esc(t.phone):t.source}</td><td>${t.dept}</td><td>${sv(t)}</td><td><button class="btn sm red" onclick="cancelT('${t.id}','${t.label}')">Cancel</button> <select style="width:auto;min-height:38px" onchange="xfer('${t.id}',this.value)"><option value="">Transfer…</option>${D.filter(d=>d.n!==t.dept).map(d=>`<option>${d.n}</option>`).join('')}</select></td></tr>`).join(''):'<tr><td colspan="6" class="mut">No active tokens.</td></tr>'}</table></div>`,
 doctors:()=>`<div class="card scroll"><table>${P.doctors.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="mut">${x.dept} · ${esc(x.time)}</div></td><td><select style="min-height:38px" onchange="setDoc(${x.i},this.value)">${['Available','Delayed','Off duty'].map(s=>`<option ${s===x.s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`,
 issue:()=>`<div class="card"><label for="in">Patient name</label><input id="in"><label for="id">Department</label><select id="id">${D.map(d=>`<option>${d.n}</option>`).join('')}</select><br><br><button class="btn" onclick="issue()">Issue walk-in token</button></div>`}[tab];
 return `<h1>Admin Dashboard</h1><div class="grid"><div class="card"><div class="mut">Active tokens</div><div class="stat">${P.waiting}</div></div><div class="card"><div class="mut">Served today</div><div class="stat">${P.served}</div></div><div class="card"><div class="mut">Avg wait (approx.)</div><div class="stat">${P.avgWait} min</div></div><div class="card"><div class="mut">Most crowded</div><div class="stat" style="font-size:1.3rem">${P.busiest}</div></div></div>
 <div class="row" style="margin-bottom:12px">${tabs.map(x=>`<button class="btn sm ${x===tab?'':'sec'}" onclick="tab='${x}';draw()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}<a class="btn sm sec" href="#display">Waiting-room display</a><button class="btn sm sec" onclick="resetDay()">Reset all queues</button><button class="btn sm sec" onclick="logout()">Sign out</button></div>${body()}`}
function resetDay(){if(confirm('Reset all queues? Every token is removed and numbering restarts. This cannot be undone.'))adminDo('/admin/reset',null,()=>'All queues reset.')}
async function login(){try{const r=await api('/admin/login',{pin:$('#pin').value});adm=r.token;store('mq_admin',adm,1);await refresh(true)}catch(e){$('#pe').textContent=e.message}}
async function logout(){await api('/admin/logout',{}).catch(()=>{});adm=null;AD=null;store('mq_admin',null,1);draw()}
async function adminDo(path,body,ok){try{const r=await api(path,body||{});if(ok)toast(ok(r))}catch(e){toast(e.message)}await refresh(true)}
const callNext=dn=>adminDo('/admin/depts/'+encodeURIComponent(dn)+'/next',null,r=>dn+': now serving '+(r.serving||'nobody (queue empty)'));
const pauseQ=(dn,paused)=>adminDo('/admin/depts/'+encodeURIComponent(dn)+'/pause',{paused});
const cancelT=(id,lb)=>{if(confirm('Cancel token '+lb+'?'))adminDo('/admin/tokens/'+id+'/cancel',null,()=>'Cancelled '+lb)};
const xfer=(id,dn)=>{if(dn)adminDo('/admin/tokens/'+id+'/transfer',{dept:dn},t=>'Token transferred to '+dn+' as '+t.label)};
const setDoc=(i,s)=>adminDo('/admin/doctors/'+i,{status:s});
function issue(){const n=$('#in').value.trim();if(n.length<3)return toast('Enter a patient name.');adminDo('/admin/walkin',{name:n,dept:$('#id').value},t=>'Issued '+t.label)}

// Live updates: the server pushes "update" on every queue change and "notice" for announcements.
function connect(){const es=new EventSource('/api/events');let t=null;
 es.addEventListener('update',()=>{clearTimeout(t);t=setTimeout(refresh,150)});
 es.addEventListener('notice',e=>{try{toast(JSON.parse(e.data).msg)}catch(x){}});
 es.onopen=()=>{if(!online)refresh()};es.onerror=()=>{online=false;drawNav()}}
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);if(P)draw();refresh(true)});
setInterval(()=>{if(!online)refresh()},5000);
refresh(true);connect();
</script></body></html>
